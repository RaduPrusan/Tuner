name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install audit tool
        run: python -m pip install --upgrade pip pip-audit

      - name: Syntax check
        run: python -m py_compile tuner-2.py

      - name: Dependency vulnerability audit
        run: python -m pip_audit -r requirements.txt --progress-spinner off
